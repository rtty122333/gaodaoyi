[platformio]
default_envs = gddy

[env:gddy]
; 官方 espressif32 平台。官方平台(6.5.0 与最新的 7.1.3 都)不含 m5stack_cardputer,
; 所以板型定义与引脚头文件随项目自带:
;     boards/m5stack_cardputer.json      -> 板型清单
;     variants/m5stack_cardputer/        -> pins_arduino.h
; 板型 JSON 里的 "build.variants_dir": "variants" 让框架从项目目录读 variant,
; 不需要往全局的 framework-arduinoespressif32 包里注入文件。
platform = espressif32@6.5.0
board    = m5stack_cardputer
framework = arduino

; Cardputer ADV 有 8MB Flash, 数据+字库较大, 用最大 app 分区
board_build.partitions = partitions.csv

; M5Cardputer 库已内置对 ADV(Stamp-S3A) 的支持, 自动依赖 M5Unified / M5GFX
lib_deps =
    M5Stack/M5Cardputer

; Cardputer ADV 走 ESP32-S3 原生 USB-CDC 下载
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed  = 921600
